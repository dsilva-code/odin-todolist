<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <nav>
            <button id="currentProject" command="show-modal" commandfor="project-dialog"></button>
            <dialog id="project-dialog">
                    <div id="projectList">

                        
                    </div>
                    <br>
                <button id="cProject" command="show-modal" commandfor="cProject-dialog" >Create Project</button>
                <dialog id="cProject-dialog"> 

                    <form id="projectForm">
                        <label for="projectName">Project Name:</label>
                        <input type="text" name="projectName" id="projectName" required>
                    <input type="submit" name="projectSubmut" id="projectSubmit">
                    </form>
                    <button commandfor="cProject-dialog" command="close">Close</button>
                </dialog>
                <button commandfor="project-dialog" command="close">Close</button>
            </dialog>
            <button id="homeButton">Home</button>
            <button id="seeProjects">...</button>
            <button id="addTask" command="show-modal" commandfor="my-dialog">Add Task</button>
            <dialog id="my-dialog">
                <form id="todoForm">
                    <label for="todoName">Name:</label>
                    <input type="text" name="todoName" id="todoName" required>
                    <label for="todoDescription">Description:</label>
                    <input type="text" name="todoDescription" id="todoDescription">
                    <label for="todoDueDate">Due Date:</label>
                    <input type="date" name="todoDueDate" id="todoDueDate">
                    <label for="todoPriority">Priority:</label>
                    <input type="number" name="todoPriority" id="todoPriority">
                    <label for="todoNote">Note:</label>
                    <input type="text" name="todoNote" id="todoNote">
                    <input type="submit" name="todoSubmut" id="todoSubmit">
                </form>
            </dialog>
        </nav>
    </header>
    <div id="projectContent">

    </div>
</body>
</html>
